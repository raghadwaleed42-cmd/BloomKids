<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom Kids | تم إنشاء الحساب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/global-ui.css">
</head>
<body class="auth-page recovery-page success-auth-page">
  <main class="auth-layout">
    <section class="form-side">
      <div class="recovery-card success-recovery-card">
        <div class="success-check" aria-hidden="true">✓</div>
        <p class="small-label">تم بنجاح</p>
        <h1>تم إنشاء حسابك بنجاح</h1>
        <p class="recovery-text">أصبح حسابك جاهزًا. يمكنك الآن تسجيل الدخول وبدء رحلتك التعليمية في بلوم كيدز.</p>
        <a href="login.html" class="main-button auth-link-button">الذهاب إلى صفحة الدخول</a>
      </div>
    </section>
    <section class="visual-side" aria-label="بيئة تعليمية تفاعلية للأطفال">
      <img class="visual-logo" src="images/Group 1171274877.svg" alt="Bloom Kids">
      <div class="visual-accent-dot" aria-hidden="true"></div>
      <div class="visual-content">
        <div class="visual-image-wrap">
          <img class="visual-image" src="images/auth-learning-photo.png" alt="أطفال في رحلة تعلم تفاعلية">
          <span class="image-caption">خطوتك الأولى اكتملت بنجاح</span>
        </div>
        <div class="visual-copy">
          <p class="gold-line">أنت جاهز</p>
          <h2>مرحبًا بك في رحلة Bloom Kids</h2>
          <p>تعلم ممتع، متابعة واضحة، وإنجازات تشجع الطفل على الاستمرار.</p>
        </div>
      </div>
    </section>
  </main>
  <a class="global-home-link" href="index.html" aria-label="العودة إلى الصفحة الرئيسية"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 10.5V20h13v-9.5"></path><path d="M9.5 20v-5h5v5"></path></svg><span>العودة إلى الصفحة الرئيسية</span></a>
</body>
</html>
